name: Build HASS ARMv7 Wheels

on:
  workflow_dispatch:
    inputs:
      os_type:
        description: 'اختر نظام التشغيل'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - ubuntu-only
          - alpine-only
  schedule:
    - cron: '0 0 1 * *'

concurrency:
  group: build-wheels-${{ github.event.inputs.os_type || 'both' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Wheels (${{ matrix.os_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: ubuntu-24.04
            image: arm32v7/ubuntu:24.04
            hass_version: "2024.12.0"
            build_ubuntu: true
          - os_name: alpine-latest
            image: arm32v7/alpine:latest
            hass_version: "2023.12.0"
            build_alpine: true
    
    # تشغيل conditionally حسب الاختيار
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.os_type == 'both' ||
      (github.event.inputs.os_type == 'ubuntu-only' && matrix.os_name == 'ubuntu-24.04') ||
      (github.event.inputs.os_type == 'alpine-only' && matrix.os_name == 'alpine-latest')

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build Wheels in Container
        run: |
          mkdir -p ${{ github.workspace }}/wheels
          
          docker run --rm \
            --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/workspace \
            ${{ matrix.image }} \
            /bin/sh -c "
              set -e
              
              # Install dependencies based on OS
              if [ -f /etc/os-release ]; then
                . /etc/os-release
                if [ \"\$ID\" = \"alpine\" ]; then
                  echo 'Installing Alpine dependencies...'
                  apk update
                  apk add python3 py3-pip python3-dev gcc g++ musl-dev libffi-dev make cargo rust tzdata jpeg-dev zlib-dev jq curl wget
                else
                  echo 'Installing Ubuntu dependencies...'
                  apt-get update
                  apt-get install -y python3 python3-pip python3-venv python3-dev build-essential libffi-dev libssl-dev libjpeg-dev zlib1g-dev rustc cargo tzdata jq curl wget
                fi
              fi
              
              echo 'Building Home Assistant ${{ matrix.hass_version }} for ${{ matrix.os_name }}...'
              
              mkdir -p /workspace/wheels
              python3 -m venv /workspace/venv
              . /workspace/venv/bin/activate
              
              pip install --upgrade pip wheel
              pip wheel --wheel-dir=/workspace/wheels homeassistant==${{ matrix.hass_version }}
              
              echo 'Creating final archive...'
              cd /workspace
              tar -czvf hass-wheels-${{ matrix.os_name }}-armv7.tar.gz -C /workspace/wheels .
            "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hass-wheels-${{ matrix.os_name }}-armv7
          path: ${{ github.workspace }}/hass-wheels-${{ matrix.os_name }}-armv7.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Home Assistant Wheels
          files: artifacts/**/*.tar.gz
          make_latest: true
